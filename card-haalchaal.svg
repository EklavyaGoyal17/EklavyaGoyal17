<text x="32" y="150" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8F9AA7">Calls elderly parents daily in their own language,</text><text x="32" y="174" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8F9AA7">checks wellbeing and medicines, and WhatsApps the</text><text x="32" y="198" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8F9AA7">family a summary, with alerts when something’s off.</text><rect x="32" y="262" width="37" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="51" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">Go</text><rect x="77.2" y="262" width="98" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="126" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">PostgreSQL</text><rect x="183.2" y="262" width="83" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="225" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">Voice AI</text><rect x="274.0" y="262" width="68" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="308" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">Claude</text><rect x="349.6" y="262" width="83" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="391" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">WhatsApp</text>
