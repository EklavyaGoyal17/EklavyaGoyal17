<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="210" viewBox="0 0 1280 210" role="img" aria-label="Principles: correctness first; make failure boring; authority lives outside the model; show the evidence"><rect x="0.5" y="0.5" width="635" height="99" rx="14" fill="#0D1116" stroke="#1D252F"/><text x="28" y="44" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#FFB547">01</text><text x="64" y="44" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#E9ECEF">Correctness first.</text><text x="64" y="72" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#8F9AA7">A fast ledger that loses money is a fast bug.</text><rect x="644.5" y="0.5" width="635" height="99" rx="14" fill="#0D1116" stroke="#1D252F"/><text x="672" y="44" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#FFB547">02</text><text x="708" y="44" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#E9ECEF">Make failure boring.</text><text x="708" y="72" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#8F9AA7">Retries, replays and crashes are designed for on day one.</text><rect x="0.5" y="110.5" width="635" height="99" rx="14" fill="#0D1116" stroke="#1D252F"/><text x="28" y="154" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#FFB547">03</text><text x="64" y="154" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#E9ECEF">Authority lives outside the model.</text><text x="64" y="182" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#8F9AA7">Never trust the thing you’re guarding.</text><rect x="644.5" y="110.5" width="635" height="99" rx="14" fill="#0D1116" stroke="#1D252F"/><text x="672" y="154" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#FFB547">04</text><text x="708" y="154" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#E9ECEF">Show the evidence.</text><text x="708" y="182" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#8F9AA7">Tests, traces and audit logs over adjectives.</text></svg>