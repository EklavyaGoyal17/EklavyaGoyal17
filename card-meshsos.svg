<text x="32" y="150" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8F9AA7">Relays distress alerts phone-to-phone over Bluetooth</text><text x="32" y="174" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8F9AA7">LE, with no SIM or internet. Dedup cache stops echo</text><text x="32" y="198" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8F9AA7">storms; offline maps; UI in 7 Indian languages.</text><rect x="32" y="262" width="52" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="58" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">Java</text><rect x="92.4" y="262" width="75" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="130" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">Android</text><rect x="175.6" y="262" width="45" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="198" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">BLE</text><rect x="228.39999999999998" y="262" width="83" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="270" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">OSMDroid</text><rect x="319.2" y="262" width="83" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="361" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">Firebase</text>
