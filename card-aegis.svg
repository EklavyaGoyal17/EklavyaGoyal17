<svg xmlns="http://www.w3.org/2000/svg" width="620" height="320" viewBox="0 0 620 320" role="img" aria-label="AEGIS — Permission system for AI agents">
<style>.p{transform-origin:560px 272px;animation:p 3.6s ease-out infinite;opacity:0}@keyframes p{0%{transform:scale(.2);opacity:.6}100%{transform:scale(1.4);opacity:0}}</style>
<defs><radialGradient id="g" cx="1" cy="1" r=".9"><stop offset="0" stop-color="#FFB547" stop-opacity=".10"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></radialGradient></defs>
<rect x=".5" y=".5" width="619" height="319" rx="16" fill="#0D1116" stroke="#1D252F"/>
<rect x=".5" y=".5" width="619" height="319" rx="16" fill="url(#g)"/>
<circle cx="560" cy="272" r="40" fill="none" stroke="#FFB547" stroke-opacity=".12"/>
<circle class="p" cx="560" cy="272" r="40" fill="none" stroke="#FFB547"/>
<rect x="0" y="0" width="4" height="70" rx="2" fill="#FFB547" transform="translate(0.5,36)"/>
<text x="32" y="50" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2" fill="#5C6876">01 · TYPESCRIPT</text>
<text x="32" y="92" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="-.8" fill="#E9ECEF">AEGIS</text>
<text x="32" y="120" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" letter-spacing="1.6" fill="#FFB547">PERMISSION SYSTEM FOR AI AGENTS</text>
<text x="588" y="70" text-anchor="end" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#FFB547">1×</text>
<text x="588" y="92" text-anchor="end" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.2" fill="#5C6876">EXECUTION PER APPROVAL</text>
<text x="32" y="150" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8F9AA7">An agent may ask to act; AEGIS decides, outside the</text><text x="32" y="174" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8F9AA7">model. Fail-closed policy engine, digest-bound human</text><text x="32" y="198" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8F9AA7">approvals, and a gateway that executes exactly once.</text><rect x="32" y="262" width="98" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="81" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">TypeScript</text><rect x="138.0" y="262" width="75" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="176" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">Fastify</text><rect x="221.2" y="262" width="75" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="259" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">Next.js</text><rect x="304.4" y="262" width="98" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="353" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">PostgreSQL</text><rect x="410.4" y="262" width="75" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="448" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">Ed25519</text>
</svg>