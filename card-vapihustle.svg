<text x="32" y="150" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8F9AA7">About 200 km² of real Vapi and Daman rebuilt in the</text><text x="32" y="174" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8F9AA7">browser: 9,241 streets, bullet trains on the viaduct,</text><text x="32" y="198" font-family="'Bricolage Grotesque','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8F9AA7">new data pipeline and missions. PS controller ready.</text><rect x="32" y="262" width="98" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="81" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">JavaScript</text><rect x="138.0" y="262" width="83" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="179" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">Three.js</text><rect x="228.8" y="262" width="121" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="289" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">OpenStreetMap</text><rect x="357.6" y="262" width="83" height="28" rx="14" fill="#131921" stroke="#2A3440"/><text x="399" y="281" text-anchor="middle" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#E9ECEF">Overture</text>
