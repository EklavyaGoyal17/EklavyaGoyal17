<circle class="ring" cx="640" cy="92" r="90"/><circle class="ring r2" cx="640" cy="92" r="90"/><circle class="ring r3" cx="640" cy="92" r="90"/>
<circle cx="640" cy="92" r="22" fill="none" stroke="#FFB547" stroke-opacity=".3" stroke-width="2"/><circle cx="640" cy="92" r="13" fill="none" stroke="#FFB547" stroke-opacity=".6" stroke-width="2"/><circle cx="640" cy="92" r="5.5" fill="#FFB547"/>
