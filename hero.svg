<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#07090C"/><stop offset=".45" stop-color="#07090C" stop-opacity=".92"/><stop offset=".62" stop-color="#07090C" stop-opacity="0"/></linearGradient>
</defs>
