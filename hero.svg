<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Eklavya Goyal — I build systems that keep working when the network doesn't.">
<style>
.ring{fill:none;stroke:#FFB547;transform-origin:1010px 215px;animation:pulse 3.2s cubic-bezier(.2,.6,.3,1) infinite;opacity:0}
.r2{animation-delay:1.07s} .r3{animation-delay:2.14s}
@keyframes pulse{0%{transform:scale(.08);opacity:.9;stroke-width:3}100%{transform:scale(1);opacity:0;stroke-width:1}}
.n{animation:ping 3.2s ease-out infinite}
@keyframes ping{0%,8%{fill:#8F9AA7}14%{fill:#FFB547}40%,100%{fill:#8F9AA7}}
.blink{animation:bl 1.6s steps(2,start) infinite} @keyframes bl{to{opacity:0}}
.up{opacity:0;animation:up .9s ease-out forwards} @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
